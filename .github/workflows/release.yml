name: Release

# Push a tag "vX.Y.Z" matching HotReloadVersion in Directory.Build.props: this builds and tests everything again, runs
# the MelonLoader API check, packages the zips (package.ps1) and publishes a GitHub release with them. The asset names
# carry no version, so https://github.com/<owner>/<repo>/releases/latest/download/MelonLoader-HotReload.zip always
# points at the newest release. Release notes come from the matching "## X.Y.Z" section of docs/changelog.md, or are
# generated from the commits when there is none.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Tag matches the version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.HotReloadVersion | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match HotReloadVersion $version in Directory.Build.props" }
          "HOTRELOAD_VERSION=$version" >> $env:GITHUB_ENV

      - name: Offline tests
        run: dotnet test tests/HotReload.Tests -c Release

      - name: Cache MelonLoader releases
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hotreload-apicompat
          key: melonloader-releases-${{ hashFiles('tools/apicompat.ps1') }}
      - name: Check against MelonLoader 0.6.0 - 0.7.3
        shell: pwsh
        run: |
          dotnet build HotReload.csproj -c Release
          ./tools/apicompat.ps1

      - name: Package
        shell: pwsh
        run: ./package.ps1

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = $null
          if (Test-Path docs/changelog.md) {
            $text = Get-Content docs/changelog.md -Raw
            $m = [regex]::Match($text, "(?ms)^##\s+v?$([regex]::Escape($env:HOTRELOAD_VERSION))\b[^\n]*\n(.*?)(?=^##\s|\z)")
            if ($m.Success -and $m.Groups[1].Value.Trim()) { $notes = $m.Groups[1].Value.Trim() }
          }
          $assets = Get-ChildItem dist -Filter *.zip | ForEach-Object FullName
          # Reproducible builds: the SDK, commit and file hashes a rebuild from this tag should match.
          $sums = Get-Content dist/SHA256SUMS.txt
          $verify = "## Verifying this release`n`n" + $sums[0].TrimStart('#', ' ') + ". The DLLs are reproducible: " +
                    "a Release build of this tag with the same .NET SDK gives the same files " +
                    "([how](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/building.md#reproducing-a-release)). " +
                    "SHA256 of the files inside the zips:`n`n``````n" + (($sums | Select-Object -Skip 1) -join "`n") + "`n``````"
          if (-not $notes) { $notes = "" }
          Set-Content release-notes.md (($notes + "`n`n" + $verify).Trim())
          gh release create "${{ github.ref_name }}" @assets --title "HotReload $env:HOTRELOAD_VERSION" --notes-file release-notes.md
